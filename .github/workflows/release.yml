name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (drafted at the current main commit)"
        required: true
        default: "v1.1.2"
permissions:
  contents: write
concurrency:
  group: dot-release-${{ github.ref }}
  cancel-in-progress: false
env:
  # Previously published, audited runtime-only app. We reuse its external
  # Splash/Kokoro/Whisper runtime payload, never its model weights, then build
  # the current source and package a fresh DMG. The SHA-256 is the published
  # Dot.dmg.sha256 for public-f6cc73d.
  DONOR_URL: https://github.com/Emin-dev/Dot/releases/download/public-f6cc73d/Dot.dmg
  DONOR_SHA256: 942f877fa64dbe338b9ba55d5475d6a3d968ca7132038e7e52d217ff17a3afc3
jobs:
  package:
    # macOS 26 is required: the app deployment floor is 26.4, and the first-open
    # check must launch the real DMG bundle rather than skip it.
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Release commit must be on main
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            test "$GITHUB_REF" = "refs/heads/main" || {
              echo "Manual releases may only be dispatched from main." >&2
              exit 1
            }
          fi
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD refs/remotes/origin/main || {
            echo "Release tags must point to a commit on main." >&2
            exit 1
          }
      - name: Bundle the published model-parts plan when available
        env:
          MODEL_PARTS_TAG: model-parts-v1
        run: |
          set -euo pipefail
          mkdir -p .tmp
          url="https://github.com/Emin-dev/Dot/releases/download/$MODEL_PARTS_TAG/model-parts.json"
          if curl -fsSL --retry 3 -o .tmp/model-parts.json "$url"; then
            python3 -B - "$MODEL_PARTS_TAG" <<'PY'
          import json, sys
          tag = sys.argv[1]
          data = json.load(open('.tmp/model-parts.json'))
          assert data.get('schema_version') == 1, 'schema_version'
          assert data.get('status') == 'ready', 'status is not ready'
          assert data.get('release_tag') == tag, 'release_tag mismatch'
          assert data.get('parts'), 'no parts'
          assert str(data.get('base_url', '')).startswith(
              f'https://github.com/Emin-dev/Dot/releases/download/{tag}/'), 'base_url'
          PY
            cp .tmp/model-parts.json Resources/model-parts.json
            echo "bundling published parts plan from $MODEL_PARTS_TAG"
          else
            echo "::warning::no published model parts plan; the DMG keeps the pending plan and the hash-verified Hugging Face route"
          fi

      - name: Build Rust runtime binaries
        run: cargo build --release --bin dot-voice --bin dot-search --bin dot-fetch --bin dot-safety
      - name: Fetch the audited runtime payload (no model weights)
        run: |
          set -euo pipefail
          mkdir -p .tmp/donor .tmp/donor/mnt .tmp/runtime .tmp/whisper
          curl -L --fail --retry 5 --retry-delay 5 -o .tmp/donor/Dot.dmg "$DONOR_URL"
          echo "$DONOR_SHA256  .tmp/donor/Dot.dmg" | shasum -a 256 -c -
          hdiutil attach .tmp/donor/Dot.dmg -nobrowse -readonly -mountpoint .tmp/donor/mnt
          trap 'hdiutil detach .tmp/donor/mnt || true' EXIT
          /usr/bin/ditto .tmp/donor/mnt/Dot.app/Contents/Resources/Offline .tmp/runtime/Offline
          /usr/bin/ditto .tmp/donor/mnt/Dot.app/Contents/Frameworks/whisper.framework .tmp/whisper/whisper.framework
          hdiutil detach .tmp/donor/mnt
          test -f .tmp/runtime/Offline/runtime-manifest.json
          test -f .tmp/whisper/whisper.framework/Modules/module.modulemap
      - name: Static contracts and release script checks
        run: |
          python3 -B scripts/check_contracts.py
          python3 -B -m unittest Tests/Python/test_release_parts.py -v
          python3 -B -m unittest Tests/Python/test_review_pipeline_contract.py -v
          python3 -B -m unittest Tests/Python/test_phase7_contract.py -v
          python3 -B -m unittest Tests/Python/test_phase7b_contract.py -v
          python3 -B -m unittest Tests/Python/test_phase7s_contract.py -v
          bash -n scripts/package_default_release.sh scripts/package_all_in_one.sh packaging/join-dot-dmg.command scripts/install-dot.sh scripts/uninstall-dot.sh scripts/sign_sandbox_app.sh scripts/build-and-sign-on-mac.sh scripts/install_acceptance_check.sh
      - name: Package the default app without model weights
        env:
          DOT_RUNTIME_PAYLOAD: .tmp/runtime/Offline
          DOT_WHISPER_FRAMEWORK: .tmp/whisper/whisper.framework
        run: bash scripts/package_default_release.sh

      - name: Install from the DMG with quarantine and stay alive for 60 s
        run: bash scripts/quarantine_launch_check.sh build-public/Dot.dmg .tmp/quarantine-check
      - name: Stage release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp build-public/Dot.dmg build-public/Dot.dmg.sha256 release-assets/
          cp scripts/install-dot.sh scripts/uninstall-dot.sh scripts/build-and-sign-on-mac.sh scripts/join_release.py release-assets/
          cp packaging/join-dot-dmg.command release-assets/
          cp docs/TEST_TODAY.md release-assets/TEST_TODAY.md
          if python3 -c 'import json; raise SystemExit(json.load(open("Resources/model-parts.json"))["status"] != "ready")'; then
            cp Resources/model-parts.json release-assets/model-parts.json
            (cd release-assets && shasum -a 256 model-parts.json > model-parts.json.sha256)
          fi
          cat > release-assets/README.txt <<'EOF'
          curl -fsSL https://github.com/Emin-dev/Dot/releases/latest/download/install-dot.sh | bash

          Dot default DMG
          ===============
          The first line is the whole install: it downloads Dot.dmg with curl,
          verifies every published SHA-256, mounts the DMG, installs Dot.app to
          ~/Applications (never /Applications or sudo), clears
          com.apple.quarantine from Dot's staged bundle, verifies the App
          Sandbox entitlements and ad-hoc signature, and opens Dot. The script
          is idempotent and safe to run again.

          Dot.dmg contains the app and its verified local runtime, but not the
          Qwen3.8 27B Q4 weights (~22.4 GB). On first launch Dot verifies the
          signed manifest and downloads the exact files with resume, retries and
          per-file SHA-256. The pinned Emin-dev/Dot model-parts-v1 release is
          the primary route; revision-pinned Hugging Face files are a
          hash-checked fallback. Both routes reject any SHA-256 mismatch.

          Minimum: Apple Silicon M5 Pro class, 48 GB Unified Memory, macOS 27+.

          First open / Gatekeeper
          -----------------------
          The public build is ad-hoc signed and NOT notarised. The installer
          clears quarantine from Dot's staged bundle and verifies the App Sandbox
          entitlements. Do not change System Settings. If macOS still refuses,
          the installer prints the exact macOS/Gatekeeper text. A no-warning
          double-click for every Mac needs Developer ID signing and notarisation,
          which requires Emin's paid Apple Developer account and is owner-only;
          it is not available in this release.

          If the one-line install is blocked by policy, build on this Mac with
          scripts/build-and-sign-on-mac.sh (in the repository). It builds the
          source, signs with the first "Apple Development" identity found by
          security find-identity -v -p codesigning (ad-hoc fallback), installs
          to ~/Applications and opens Dot. That signature only satisfies
          Gatekeeper on the Mac that owns the certificate.

          Then follow TEST_TODAY.md in this release.

          Remove Dot completely
          ---------------------
          curl -fsSL https://github.com/Emin-dev/Dot/releases/latest/download/uninstall-dot.sh | bash

          It removes the app, sandbox container, caches, preferences and model,
          resets privacy approvals and prints "PASS: your Mac is back to how it
          was". The in-app menu has the same command under "Remove Dot completely".

          All-in-one installer
          ====================
          The complete DMG is 22+ GB and GitHub limits each asset to 2 GB. Its
          owner-produced parts (Dot.dmg.partNNN + Dot.dmg.parts.json) are NOT
          published yet; the released DMG plus the first-launch model download
          is the supported install today. See docs/QUESTIONS_FOR_EMIN.md sections 2 and 3.
          EOF
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dot-release-assets
          path: release-assets/*
          if-no-files-found: error
      - name: Create the draft release (nothing is public yet)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag_lines=$(git ls-remote --tags origin "refs/tags/$TAG") || {
            echo "could not query tag $TAG" >&2
            exit 1
          }
          if [ -n "$tag_lines" ]; then
            git fetch --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
            tag_commit=$(git rev-parse "refs/tags/$TAG^{commit}")
            test "$tag_commit" = "$GITHUB_SHA" || {
              echo "tag $TAG points at $tag_commit, not the built commit $GITHUB_SHA" >&2
              exit 1
            }
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            is_draft=$(gh release view "$TAG" --json isDraft --jq '.isDraft')
            if [ "$is_draft" = "true" ]; then
              gh release delete "$TAG" --yes
            else
              echo "release $TAG is already published; refusing to replace it" >&2
              exit 1
            fi
          fi
          gh release create "$TAG" release-assets/* \
            --draft \
            --target "$GITHUB_SHA" \
            --title "Dot $TAG" \
            --notes-file release-assets/TEST_TODAY.md
          gh release view "$TAG" --json tagName,isDraft,assets > .tmp/draft-release.json
          test "$(python3 -c 'import json; print(json.load(open(".tmp/draft-release.json"))["isDraft"])')" = "True"

  privacy:
    # Reusable no-trace lane: snapshot, per-user install, sandbox proof, smoke
    # test, uninstall and snapshot diff. Publishing waits for it.
    needs: package
    uses: ./.github/workflows/privacy-clean.yml

  installer-one-liner:
    # (a) The exact documented shape: curl the draft install-dot.sh and pipe it
    # into bash. The draft is served locally because GitHub draft assets need a
    # token; the script being exercised is byte-for-byte the drafted asset.
    needs: package
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Download the draft release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p .tmp/draft
          gh release download "$TAG" --dir .tmp/draft
          test -f .tmp/draft/install-dot.sh
          test -f .tmp/draft/Dot.dmg
          test -f .tmp/draft/Dot.dmg.sha256
      - name: Run curl | bash and prove Dot runs after 60 s
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 --directory .tmp/draft \
            > .tmp/http-server.log 2>&1 &
          SERVER=$!
          trap 'kill "$SERVER" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/install-dot.sh -o /dev/null; then break; fi
            sleep 1
          done
          DOT_RELEASE_BASE=http://127.0.0.1:8765 \
            bash -c 'curl -fsSL "$DOT_RELEASE_BASE/install-dot.sh" | bash'
          codesign -d --entitlements - "$HOME/Applications/Dot.app" 2>&1 | grep -q com.apple.security.app-sandbox
          echo "PASS: the installed app carries com.apple.security.app-sandbox"
          bash scripts/install_acceptance_check.sh "$HOME/Applications/Dot.app" 60
      - name: Quit Dot and remove the test install
        if: always()
        run: |
          osascript -e 'tell application "Dot" to quit' >/dev/null 2>&1 || true
          pkill -x Dot >/dev/null 2>&1 || true
          rm -rf "$HOME/Applications/Dot.app" "$HOME/Applications/.dot-install-created-applications"; rmdir "$HOME/Applications" 2>/dev/null || true

  quarantine-install:
    # (b) A browser-like DMG: set com.apple.quarantine on the downloaded DMG,
    # run the installer, then prove the attribute is gone and Dot stays alive.
    needs: package
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Download the draft release assets and mark the DMG quarantined
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p .tmp/draft
          gh release download "$TAG" --dir .tmp/draft
          xattr -w com.apple.quarantine \
            "0081;$(printf %x "$(date +%s)");Safari;" .tmp/draft/Dot.dmg
          xattr -p com.apple.quarantine .tmp/draft/Dot.dmg
      - name: Install the quarantined DMG and prove quarantine is gone
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 --directory .tmp/draft \
            > .tmp/http-server.log 2>&1 &
          SERVER=$!
          trap 'kill "$SERVER" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/Dot.dmg.sha256 -o /dev/null; then break; fi
            sleep 1
          done
          DOT_RELEASE_BASE=http://127.0.0.1:8765 \
          DOT_DMG="$PWD/.tmp/draft/Dot.dmg" \
          DOT_TEST_QUARANTINE=1 \
            bash .tmp/draft/install-dot.sh
          # The installer never touches xattrs outside Dot's staged bundle, so
          # the browser-quarantined DMG keeps its attribute until it is deleted.
          if ! xattr -p com.apple.quarantine .tmp/draft/Dot.dmg >/dev/null 2>&1; then
            echo "the CI fixture DMG lost its quarantine attribute" >&2
            exit 1
          fi
          echo "PASS: the downloaded DMG was not modified"
          if xattr -p com.apple.quarantine "$HOME/Applications/Dot.app" >/dev/null 2>&1; then
            echo "com.apple.quarantine is still present on $HOME/Applications/Dot.app" >&2
            exit 1
          fi
          echo "PASS: com.apple.quarantine is gone from the installed Dot.app"
          bash scripts/install_acceptance_check.sh "$HOME/Applications/Dot.app" 60
      - name: Quit Dot and remove the test install
        if: always()
        run: |
          osascript -e 'tell application "Dot" to quit' >/dev/null 2>&1 || true
          pkill -x Dot >/dev/null 2>&1 || true
          rm -rf "$HOME/Applications/Dot.app" "$HOME/Applications/.dot-install-created-applications"; rmdir "$HOME/Applications" 2>/dev/null || true

  spctl-codesign:
    # (c) Record the Gatekeeper verdict. "rejected" is the honest expected
    # result until the owner notarises with a paid Developer ID; codesign must
    # still verify the ad-hoc signature.
    needs: package
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Download the draft release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p .tmp/draft
          gh release download "$TAG" --dir .tmp/draft
      - name: Install, verify codesign and record spctl
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 --directory .tmp/draft \
            > .tmp/http-server.log 2>&1 &
          SERVER=$!
          trap 'kill "$SERVER" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/install-dot.sh -o /dev/null; then break; fi
            sleep 1
          done
          DOT_RELEASE_BASE=http://127.0.0.1:8765 \
            bash -c 'curl -fsSL "$DOT_RELEASE_BASE/install-dot.sh" | bash'
          codesign --verify --deep --strict "$HOME/Applications/Dot.app"
          codesign -d --entitlements - "$HOME/Applications/Dot.app" 2>&1 | grep -q com.apple.security.app-sandbox
          echo "PASS: codesign --verify --deep --strict and App Sandbox entitlement" >> "$GITHUB_STEP_SUMMARY"
          set +e
          SPCTL_OUTPUT="$(spctl --assess -vv "$HOME/Applications/Dot.app" 2>&1)"
          SPCTL_STATUS=$?
          set -e
          {
            echo "### spctl --assess -vv $HOME/Applications/Dot.app"
            echo '```'
            echo "$SPCTL_OUTPUT"
            echo '```'
            echo "Exit status: $SPCTL_STATUS (rejected is expected until Developer ID notarisation)"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$SPCTL_OUTPUT"
          case "$SPCTL_OUTPUT" in
            *rejected*) ;;
            *) echo "spctl did not report the expected rejection" >&2; exit 1 ;;
          esac
      - name: Quit Dot and remove the test install
        if: always()
        run: |
          osascript -e 'tell application "Dot" to quit' >/dev/null 2>&1 || true
          pkill -x Dot >/dev/null 2>&1 || true
          rm -rf "$HOME/Applications/Dot.app" "$HOME/Applications/.dot-install-created-applications"; rmdir "$HOME/Applications" 2>/dev/null || true

  publish:
    # The release becomes public and Latest only after all three acceptance
    # lanes are green.
    needs: [installer-one-liner, quarantine-install, spctl-codesign, privacy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publish the tagged release as Latest only when every acceptance job is green
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          test "$(gh release view "$TAG" --json isDraft --jq '.isDraft')" = "true" || {
            echo "release $TAG is not a draft; refusing to publish" >&2
            exit 1
          }
          gh release edit "$TAG" --draft=false --latest
          gh release view "$TAG" --json tagName,isDraft,assets \
            --jq '{tag: .tagName, draft: .isDraft, assets: [.assets[].name]}'
          test "$(gh release view "$TAG" --json isDraft --jq '.isDraft')" = "false"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')" = "$TAG"
