name: Release prerequisites
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: macos-15
    timeout-minutes: 10
    env:
      # macOS 26 App Intents metadata requires the installed Xcode 26 SDK.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Homebrew Python links TLS outside its root and correctly fails Seatbelt.
      # Use the official test toolchain; never widen the product sandbox for CI.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Model-free source verification
        run: bash scripts/verify_macos.sh
      - name: Require complete native acceptance before distribution
        run: |
          echo 'This runner cannot validate the full bundled model. No development DMG is published.'
          echo 'Use scripts/build_complete.sh, native offline acceptance, then scripts/package_complete.sh.'
          exit 1
