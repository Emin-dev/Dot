name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-15   # Apple Silicon image
    steps:
      - uses: actions/checkout@v4

      - name: Build app + DMG
        run: bash build.sh

      - name: Sanity check
        run: |
          file build/Dot.app/Contents/MacOS/Dot
          codesign -dv build/Dot.app
          ls -lh Dot.dmg

      - name: Compute tag (for manual runs)
        id: tag
        run: |
          if [ -z "${GITHUB_REF_NAME}" ] || [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "tag=v0.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Dot ${{ steps.tag.outputs.tag }}"
          generate_release_notes: true
          files: Dot.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
