name: Native companion checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: dot-native-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  macos:
    # Standard public-repository runner. Test Python is provisioned explicitly.
    # No neural payloads, app launch, dependency caches, microphone access,
    # or publishing credentials. Upload only the gated development DMG/receipt.
    runs-on: macos-15
    timeout-minutes: 10
    env:
      # macOS 26 App Intents metadata requires the installed Xcode 26 SDK.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          persist-credentials: false
      # Homebrew Python links TLS outside its root and correctly fails Seatbelt.
      # Use the official test toolchain; never widen the product sandbox for CI.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Test, compile and package with zero warnings
        run: bash scripts/verify_macos.sh
      - name: Record development packaging receipt
        run: python3 -B scripts/write_candidate_receipt.py
      - name: Upload model-free development candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: Dot-development-${{ github.sha }}-${{ runner.arch }}-${{ github.run_attempt }}
          path: |
            build/Dot.dmg
            build/Dot-candidate-receipt.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
