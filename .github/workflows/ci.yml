name: Native companion checks
on:
  push:
    branches: [main, 'codex/dot-floating-splash-*']
  pull_request:
permissions:
  contents: read
concurrency:
  group: dot-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    # Standard public-repository runner. No models, app launch, downloads,
    # caches, uploaded artifacts, microphone access, or publishing credentials.
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Swift core tests
        run: swift test
      - name: Xcode app build and XCTest suite
        run: |
          set -o pipefail
          xcodebuild -project Dot.xcodeproj -scheme Dot -configuration Debug \
            -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/DotDerived" \
            CODE_SIGNING_ALLOWED=NO test
      - name: Release compile
        run: |
          xcodebuild -project Dot.xcodeproj -scheme Dot -configuration Release \
            -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/DotRelease" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Package verified test build
        run: bash build.sh
      - name: Export bounded test DMG in log
        run: |
          python3 - <<'PY'
          import base64, hashlib, pathlib
          p = pathlib.Path('build/Dot.dmg')
          data = p.read_bytes()
          assert len(data) <= 2_000_000, 'Refusing oversized log export'
          print('DOT_DMG_SHA256=' + hashlib.sha256(data).hexdigest())
          print('DOT_DMG_BYTES=' + str(len(data)))
          print('DOT_DMG_BASE64_BEGIN')
          encoded = base64.b64encode(data).decode('ascii')
          for start in range(0, len(encoded), 100):
              print(encoded[start:start + 100])
          print('DOT_DMG_BASE64_END')
          PY
