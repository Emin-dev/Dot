name: Native companion checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: dot-native-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  macos:
    # Standard public-repository runner. Test Python is provisioned explicitly.
    # No neural payloads, app launch, dependency caches, uploaded artifacts,
    # microphone access, or publishing credentials.
    runs-on: macos-15
    timeout-minutes: 10
    env:
      # macOS 26 App Intents metadata requires the installed Xcode 26 SDK.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          persist-credentials: false
      # Homebrew Python links TLS outside its root and correctly fails Seatbelt.
      # Use the official test toolchain; never widen the product sandbox for CI.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Test, compile and package with zero warnings
        run: bash scripts/verify_macos.sh
      - name: Record development packaging receipt
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib
          p = pathlib.Path('build/Dot.dmg')
          assert p.is_file() and p.stat().st_size > 0, 'Missing development packaging result'
          with p.open('rb') as stream:
            digest = hashlib.file_digest(stream, 'sha256').hexdigest()
          print(json.dumps({'artifact_kind': 'model-free-development-only',
                            'sha256': digest, 'bytes': p.stat().st_size,
                            'final_installer': False}, sort_keys=True))
          PY
