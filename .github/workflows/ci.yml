name: Native companion checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dot-native-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false
jobs:
  rust-gates:
    # Portable Rust gates. dot-voice is macOS-only (fullfp16) and runs below.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Rust components
        run: rustup component add rustfmt clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check -p dot-research -p dot-runtime
      - name: Test
        run: cargo test -p dot-research -p dot-runtime
      - name: Clippy
        run: cargo clippy -p dot-research -p dot-runtime --all-targets -- -D warnings
      - name: Static contracts
        run: python3 -B scripts/check_contracts.py
      - name: Model-part split and join contracts
        run: |
          python3 -B -m unittest Tests/Python/test_release_parts.py -v
          python3 -B -m unittest Tests/Python/test_review_pipeline_contract.py -v

  swift-test:
    # Portable pure-core lane on an arm64 macOS runner. The Xcode 26 SDK is
    # required because the source uses macOS 26 App Intents types.
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test --parallel

  dot-voice:
    # Kokoro/MLX `fullfp16` only builds on arm64 macOS; never on the Pi.
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust components
        run: rustup component add rustfmt clippy
      - name: Build dot-voice
        run: cargo build --release -p dot-voice
      - name: Test dot-voice protocol parsing
        run: cargo test --release -p dot-voice

  dot-safety:
    # The R16 approver's prompt fencing and verdict parsing. llama.cpp builds with Metal, so
    # macOS only; a job of its own keeps the dot-voice job inside its time limit.
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test dot-safety prompt fencing and verdict parsing
        run: cargo test --release -p dot-safety

  macos:
    # Standard public-repository runner. Test Python is provisioned explicitly.
    # No neural payloads, app launch, dependency caches, microphone access,
    # or publishing credentials. Keep package validation internal; no binary upload.
    runs-on: macos-15
    timeout-minutes: 30
    env:
      # macOS 26 App Intents metadata requires the installed Xcode 26 SDK.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          persist-credentials: false
      # Homebrew Python links TLS outside its root and correctly fails Seatbelt.
      # Use the official test toolchain; never widen the product sandbox for CI.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Test, compile and package with zero warnings
        run: bash scripts/verify_macos.sh
      - name: Record development packaging receipt
        run: python3 -B scripts/write_candidate_receipt.py
